[project]
name = "movie-studio"
version = "0.1.0"
description = "Short films from a written story: Claude writes and directs, open models render picture and sound."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.3.0",
    "pydantic>=2.9",
    "pyyaml>=6",
    "typer>=0.15",
]

[project.scripts]
studio = "studio.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

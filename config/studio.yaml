    files:
      - {path: diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors, size: 21504034224, sha256: c4279eeff115cbeaca494bd2183e7d768c38fe85a184dc6afbb7159157c44334}
